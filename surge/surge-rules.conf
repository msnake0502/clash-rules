# Surge 规则引用模板
# 将 JMS 替换为你在 [Proxy Group] 中实际存在的策略组名称。
# 将下列内容复制到 Surge Profile 的 [Rule] 段。规则集通过固定 Raw URL 更新，无需改动 Surge 配置。
# PROCESS-NAME 规则（app.list、directapp.list、applications.list）仅适用于 Surge Mac。

[Rule]
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/directapp.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/app.list,JMS
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/ai.list,JMS
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/google.list,JMS
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/proxy.list,JMS
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/myproxy.list,JMS
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/telegramcidr.list,JMS,no-resolve
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/mydirect.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/applications.list,DIRECT
DOMAIN,clash.razord.top,DIRECT
DOMAIN,yacd.haishan.me,DIRECT
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/private.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/reject.list,REJECT
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/icloud.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/apple.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/direct.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/lancidr.list,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/msnake0502/clash-rules/release/surge/cncidr.list,DIRECT,no-resolve
RULE-SET,LAN,DIRECT
GEOIP,CN,DIRECT
FINAL,JMS
